databases:
  - name: expenditure
    databaseName: expenditure_db
    user: zafron

services:
  - type: web
    name: expenditure
    runtime: ruby
    buildCommand: "./bin/render-build.sh; bundle exec rails db:migrate"
    startCommand: "bundle exec puma -C config/puma.rb"
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: expenditure
          property: connectionString
      - key: 3690588fa21acada7bee22e9fd088138
        sync: false